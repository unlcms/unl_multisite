unl_multisite.site_list:
  path: '/admin/sites/unl'
  defaults:
    _form: '\Drupal\unl_multisite\Form\UnlMultisiteList'
    _title: 'Multisite management'
  requirements:
    _role: 'administrator + super_administrator'

unl_multisite.site_add:
  path: '/admin/sites/unl/sites/add'
  defaults:
    _form: '\Drupal\unl_multisite\Form\UnlMultisiteAdd'
    _title: 'Create new site'
  requirements:
    _role: 'administrator + super_administrator'

unl_multisite.site_aliases_create:
  path: '/admin/sites/unl/sites/{site_id}/aliases/create'
  defaults:
    _form: '\Drupal\unl_multisite\Form\UnlMultisiteAliasesCreate'
    _title: 'Create site alias'
  requirements:
    _role: 'administrator + super_administrator'
    site_id: ^\d+$

unl_multisite.site_aliases:
  path: '/admin/sites/unl/sites/{site_id}/aliases'
  defaults:
    _form: '\Drupal\unl_multisite\Form\UnlMultisiteAliases'
    _title: 'Site aliases'
  requirements:
    _role: 'administrator + super_administrator'
    site_id: ^\d+$

unl_multisite.site_delete:
  path: '/admin/sites/unl/sites/{site_id}/delete'
  defaults:
    _form: '\Drupal\unl_multisite\Form\UnlMultisiteDelete'
    _title: 'Confirm site deletion'
  requirements:
    _role: 'administrator + super_administrator'
    site_id: ^\d+$

unl_multisite.site_edit:
  path: '/admin/sites/unl/sites/{site_id}/edit'
  defaults:
    _form: '\Drupal\unl_multisite\Form\UnlMultisiteEdit'
    _title: 'Edit site'
  requirements:
    _role: 'administrator + super_administrator'
    site_id: ^\d+$

unl_multisite.site_mysites_list:
  path: '/mysites'
  defaults:
    _controller: '\Drupal\unl_multisite\Controller\UnlMultisiteController::unl_multisite_my_sites'
    _title: 'My Sites'
  requirements:
    _role: 'authenticated'
  options:
    no_cache: TRUE

unl_multisite.ttp_report:
  path: '/admin/sites/unl/ttp-report'
  defaults:
    _controller: '\Drupal\unl_multisite\Controller\TtpReportController::report'
    _title: 'Temp transition page report'
  requirements:
    _role: 'administrator + super_administrator'

unl_multisite.customization_report:
  path: '/admin/sites/unl/customization-report'
  defaults:
    _controller: '\Drupal\unl_multisite\Controller\CustomizationReportController::report'
    _title: 'UNL Customization Report'
  requirements:
    _role: 'administrator + super_administrator'

unl_multisite.json_feed:
  path: '/admin/sites/unl/json-feed'
  defaults:
    _controller: '\Drupal\unl_multisite\Controller\UnlMultisiteController:unl_multisite_all_sites_json'
    _title: 'JSON Feed of Sites'
  requirements:
    _role: 'administrator + super_administrator'
  options:
    no_cache: TRUE
